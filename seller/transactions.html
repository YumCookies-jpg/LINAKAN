<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transaksi Penjual - LINAKAN</title>
    <link rel="stylesheet" href="../assets/css/variables.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/base.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/components.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/layout.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/responsive.css?v=ui2" />
    <style>
      .earnings-header {
        background: linear-gradient(
          135deg,
          var(--color-secondary) 0%,
          var(--color-secondary-light) 100%
        );
        color: var(--color-white);
        padding: var(--space-3xl) var(--space-2xl);
        margin: calc(-var(--space-3xl)) calc(-var(--space-2xl)) var(--space-3xl);
        border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      }

      .earnings-card {
        background: var(--color-white);
        border-radius: var(--radius-lg);
        padding: var(--space-2xl);
        margin-top: calc(-80px);
        position: relative;
        box-shadow: var(--shadow-lg);
        margin-bottom: var(--space-3xl);
      }

      .earnings-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-lg);
      }

      .earnings-item {
        text-align: center;
        padding: var(--space-lg);
      }

      .earnings-value {
        font-size: var(--font-size-2xl);
        font-weight: var(--font-weight-bold);
        color: var(--color-primary);
        margin-bottom: var(--space-sm);
      }

      .earnings-label {
        color: var(--color-text-muted);
        font-size: var(--font-size-sm);
      }

      .table-container {
        background: var(--color-white);
        border: 1px solid var(--color-border-soft);
        border-radius: var(--radius-lg);
        overflow-x: auto;
        box-shadow: var(--shadow-sm);
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-2xl);
        gap: var(--space-lg);
      }

      .section-title {
        font-size: var(--font-size-xl);
        font-weight: var(--font-weight-bold);
        color: var(--color-text-dark);
        margin: 0;
      }

      .transaction-row {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: var(--space-lg);
        padding: var(--space-lg);
        border-bottom: 1px solid var(--color-border-soft);
        align-items: center;
      }

      .transaction-row:last-child {
        border-bottom: none;
      }

      .transaction-row-header {
        background: var(--color-light-gray);
        font-weight: var(--font-weight-semibold);
        text-transform: uppercase;
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
      }

      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: var(--radius-md);
        font-size: var(--font-size-xs);
        font-weight: var(--font-weight-semibold);
      }

      .status-confirmed {
        background: rgba(0, 69, 45, 0.1);
        color: var(--color-success);
      }

      .status-completed {
        background: rgba(0, 69, 45, 0.1);
        color: var(--color-success);
      }

      .status-cancelled {
        background: rgba(179, 38, 30, 0.1);
        color: var(--color-error);
      }

      .empty-state {
        text-align: center;
        padding: var(--space-3xl);
        color: var(--color-text-muted);
      }

      .filter-group {
        display: flex;
        gap: var(--space-md);
        flex-wrap: wrap;
        margin-bottom: var(--space-2xl);
      }

      .filter-button {
        padding: var(--space-md) var(--space-lg);
        border: 1px solid var(--color-border-soft);
        background: var(--color-white);
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition-fast);
        font-size: var(--font-size-sm);
      }

      .filter-button.active {
        background: var(--color-secondary);
        color: var(--color-white);
        border-color: var(--color-secondary);
      }

      @media (max-width: 1024px) {
        .earnings-grid {
          grid-template-columns: 1fr;
        }

        .transaction-row {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      @media (max-width: 640px) {
        .transaction-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <div
        class="navbar-brand"
        onclick="window.location.href = '../index.html'"
      >
        <span class="brand-mark"></span> LINAKAN
      </div>
      <ul class="navbar-menu">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="listings.html">Limbah Saya</a></li>
        <li><a href="transactions.html" class="active">Transaksi</a></li>
      </ul>
      <div class="navbar-actions">
        <button class="btn btn-ghost" onclick="handleLogout()">Logout</button>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-3xl mb-3xl">
      <!-- Header -->
      <div class="earnings-header">
        <h1
          style="margin: 0 0 var(--space-md) 0; font-size: var(--font-size-2xl)"
        >
          Penghasilan & Transaksi
        </h1>
        <p style="margin: 0; opacity: 0.95">
          Pantau semua penjualan limbah Anda
        </p>
      </div>

      <!-- Earnings Summary -->
      <div class="earnings-card">
        <div class="earnings-grid">
          <div class="earnings-item">
            <div class="earnings-value" id="total-earnings">Rp 0</div>
            <div class="earnings-label">Total Penghasilan</div>
          </div>
          <div class="earnings-item">
            <div class="earnings-value" id="total-transactions">0</div>
            <div class="earnings-label">Transaksi Selesai</div>
          </div>
          <div class="earnings-item">
            <div class="earnings-value" id="average-earnings">Rp 0</div>
            <div class="earnings-label">Rata-rata/Transaksi</div>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="section-header">
        <h2 class="section-title">Status Transaksi</h2>
      </div>
      <div class="filter-group">
        <button class="filter-button active" onclick="filterStatus('all')">
          Semua
        </button>
        <button class="filter-button" onclick="filterStatus('confirmed')">
          Dikonfirmasi
        </button>
        <button class="filter-button" onclick="filterStatus('completed')">
          Selesai
        </button>
        <button class="filter-button" onclick="filterStatus('cancelled')">
          Dibatalkan
        </button>
      </div>

      <!-- Transactions Table -->
      <div class="table-container">
        <div class="transaction-row transaction-row-header">
          <div>Tanggal</div>
          <div>Limbah</div>
          <div>Pembeli</div>
          <div>Berat (kg)</div>
          <div>Penghasilan (Rp)</div>
          <div>Status</div>
          <div>Aksi</div>
        </div>
        <div id="transactions-list">
          <div class="empty-state">Memuat...</div>
        </div>
      </div>
    </div>

    <script src="../assets/js/data.js?v=ui2"></script>
    <script src="../assets/js/pricing.js?v=ui2"></script>

    <script>
      let currentSeller = null;
      let allTransactions = [];
      let currentFilter = "all";

      document.addEventListener("DOMContentLoaded", () => {
        const currentUser = DataManager.getCurrentUser();
        if (!currentUser || currentUser.userType !== "seller") {
          window.location.href = "../index.html";
          return;
        }

        currentSeller = DataManager.getSeller(currentUser.userId);
        if (!currentSeller) {
          window.location.href = "../index.html";
          return;
        }

        loadTransactions();
      });

      function loadTransactions() {
        // Get all transactions where current seller is the seller
        const allTxns = DataManager.getAllTransactions();
        allTransactions = allTxns.filter(
          (t) => t.sellerId === currentSeller.id,
        );

        // Calculate stats
        const completed = allTransactions.filter(
          (t) => t.status === "completed",
        ).length;
        const summary = WalletManager.getSellerWalletSummary(currentSeller.id);

        document.getElementById("total-earnings").textContent =
          `Rp ${summary.totalEarnings.toLocaleString("id-ID")}`;
        document.getElementById("total-transactions").textContent = completed;
        document.getElementById("average-earnings").textContent =
          completed > 0
            ? `Rp ${(summary.totalEarnings / completed).toLocaleString("id-ID")}`
            : "Rp 0";

        renderTransactions(allTransactions);
      }

      function renderTransactions(transactions) {
        const container = document.getElementById("transactions-list");

        if (transactions.length === 0) {
          container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 48px; margin-bottom: var(--space-lg);">📋</div>
            <p>Belum ada riwayat transaksi</p>
          </div>
        `;
          return;
        }

        container.innerHTML = transactions
          .map((txn) => {
            const date = new Date(txn.createdAt).toLocaleDateString("id-ID");
            const buyer = DataManager.getFarmer(txn.farmerId);
            const earning = PricingEngine.calculateSellerEarnings(
              txn.totalPrice,
            );

            return `
          <div class="transaction-row">
            <div>${date}</div>
            <div>${txn.wasteName || "-"}</div>
            <div>${buyer?.name || "-"}</div>
            <div>${txn.listingWeight || "-"}</div>
            <div><strong>Rp ${earning.toLocaleString("id-ID")}</strong></div>
            <div>
              <span class="status-badge status-${txn.status}">
                ${txn.status.charAt(0).toUpperCase() + txn.status.slice(1)}
              </span>
            </div>
            <div>
              <button class="btn btn-sm btn-ghost" onclick="viewDetail('${txn.id}')">Lihat</button>
            </div>
          </div>
        `;
          })
          .join("");
      }

      function filterStatus(status) {
        currentFilter = status;

        // Update active button
        document
          .querySelectorAll(".filter-button")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");

        // Filter and render
        let filtered = allTransactions;
        if (status !== "all") {
          filtered = allTransactions.filter((t) => t.status === status);
        }

        renderTransactions(filtered);
      }

      function viewDetail(transactionId) {
        const txn = allTransactions.find((t) => t.id === transactionId);
        if (!txn) return;

        const buyer = DataManager.getFarmer(txn.farmerId);
        const earning = PricingEngine.calculateSellerEarnings(txn.totalPrice);

        alert(
          `Detail Transaksi:\n\nID: ${txn.id.substring(0, 8)}\nLimbah: ${txn.wasteName}\nPembeli: ${buyer?.name}\nBerat: ${txn.listingWeight} kg\nTotal: Rp ${(txn.totalPrice || 0).toLocaleString("id-ID")}\nPenghasilan Anda: Rp ${earning.toLocaleString("id-ID")}\nStatus: ${txn.status}`,
        );
      }

      function handleLogout() {
        DataManager.logout();
        window.location.href = "../index.html";
      }
    </script>
  </body>
</html>

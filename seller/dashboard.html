<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Penjual - LINAKAN</title>
    <link rel="stylesheet" href="../assets/css/variables.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/base.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/components.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/layout.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/responsive.css?v=ui2" />
    <style>
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: var(--space-2xl);
        margin-bottom: var(--space-3xl);
      }

      .stat-card {
        background: var(--color-white);
        border: 1px solid var(--color-border-soft);
        color: var(--color-text-primary);
        padding: var(--space-2xl);
        border-radius: var(--radius-md);
        text-align: left;
        box-shadow: var(--shadow-sm);
      }

      .stat-number {
        font-size: var(--font-size-3xl);
        font-weight: var(--font-weight-bold);
        color: var(--color-primary);
        margin-bottom: var(--space-sm);
      }

      .stat-label {
        font-size: var(--font-size-sm);
        color: var(--color-text-subtle);
      }

      .listings-section {
        background: var(--color-white);
        border-radius: var(--radius-md);
        border: 1px solid var(--color-border-soft);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }

      .listings-header {
        padding: var(--space-2xl);
        border-bottom: 1px solid var(--color-border-soft);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .listings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: var(--space-2xl);
        padding: var(--space-2xl);
      }

      .listing-card {
        border: 1px solid var(--color-border-soft);
        border-radius: var(--radius-md);
        overflow: hidden;
        transition: all var(--transition-base);
        background: var(--color-white);
      }

      .listing-card:hover {
        box-shadow: var(--shadow-lg);
        transform: translateY(-2px);
      }

      .listing-image {
        width: 100%;
        height: 200px;
        background:
          linear-gradient(135deg, rgba(255, 222, 170, 0.82), rgba(177, 240, 205, 0.76)),
          repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.26) 0 10px, transparent 10px 20px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--font-size-2xl);
      }

      .listing-content {
        padding: var(--space-lg);
      }

      .listing-name {
        font-weight: var(--font-weight-semibold);
        margin-bottom: var(--space-sm);
        font-size: var(--font-size-base);
      }

      .listing-meta {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
        margin-bottom: var(--space-md);
      }

      .listing-price {
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-bold);
        color: var(--color-primary);
        margin-bottom: var(--space-md);
      }

      .listing-footer {
        display: flex;
        gap: var(--space-sm);
        margin-top: var(--space-lg);
      }

      .listing-footer .btn {
        flex: 1;
        padding: var(--space-md);
        font-size: var(--font-size-sm);
      }

      .status-badge {
        display: inline-block;
        padding: var(--space-sm) var(--space-md);
        border-radius: var(--radius-xl);
        font-size: var(--font-size-xs);
        font-weight: var(--font-weight-semibold);
        margin-bottom: var(--space-md);
      }

      .status-available {
        background: rgba(0, 69, 45, 0.1);
        color: var(--color-primary);
      }

      .status-reserved {
        background: rgba(80, 55, 0, 0.1);
        color: var(--color-warning);
      }

      .status-expired {
        background: rgba(179, 38, 30, 0.1);
        color: var(--color-error);
      }

      .empty-state {
        text-align: center;
        padding: var(--space-3xl);
        color: var(--color-text-muted);
      }

      .empty-state-icon {
        font-size: 64px;
        margin-bottom: var(--space-lg);
      }

      @media (max-width: 1024px) {
        .dashboard-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 640px) {
        .dashboard-grid {
          grid-template-columns: 1fr;
        }

        .listings-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <div class="navbar-brand"><span class="brand-mark"></span> LINAKAN</div>
      <ul class="navbar-menu">
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
        <li><a href="listings.html">Daftar Limbah</a></li>
        <li><a href="transactions.html">Transaksi</a></li>
      </ul>
      <div class="navbar-actions">
        <button
          class="btn btn-primary"
          onclick="window.location.href = 'create-listing.html'"
        >
          Tambah Limbah
        </button>
        <button class="btn btn-ghost" onclick="handleLogout()">Logout</button>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-3xl mb-3xl">
      <!-- Welcome Section -->
      <div style="margin-bottom: var(--space-3xl)">
        <div class="eyebrow">Ruang kerja penyuplai</div>
        <h1>Dashboard Penjual</h1>
        <p class="page-kicker" id="seller-name">Memuat data...</p>
      </div>

      <!-- Statistics Cards -->
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-number" id="stat-listings">0</div>
          <div class="stat-label">Limbah Aktif</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-weight">0</div>
          <div class="stat-label">Total Berat (kg)</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-reserved">0</div>
          <div class="stat-label">Dipesan</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-earnings">Rp 0</div>
          <div class="stat-label">Penghasilan</div>
        </div>
      </div>

      <!-- Recent Listings -->
      <div class="listings-section">
        <div class="listings-header">
          <h2 style="margin: 0">Daftar Limbah Terbaru</h2>
          <button
            class="btn btn-primary"
            onclick="window.location.href = 'create-listing.html'"
          >
            Tambah Limbah
          </button>
        </div>

        <div id="listings-container" class="listings-grid">
          <!-- Listings will be loaded here -->
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div
      id="toast-container"
      style="
        position: fixed;
        bottom: var(--space-2xl);
        right: var(--space-2xl);
        z-index: 1000;
      "
    ></div>

    <style>
      .toast {
        background: var(--color-white);
        border-left: 4px solid var(--color-primary);
        padding: var(--space-lg);
        border-radius: var(--radius-md);
        display: flex;
        gap: var(--space-lg);
        align-items: center;
        margin-bottom: var(--space-lg);
        box-shadow: var(--shadow-lg);
        max-width: 400px;
        animation: slideIn 0.3s ease-out;
      }

      .toast-icon {
        font-size: var(--font-size-2xl);
        flex-shrink: 0;
      }

      .toast-content {
        flex: 1;
      }

      .toast-content strong {
        display: block;
        margin-bottom: var(--space-sm);
      }

      .toast-content p {
        margin: 0;
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }

      .toast-close {
        background: none;
        border: none;
        font-size: var(--font-size-xl);
        cursor: pointer;
        color: var(--color-text-muted);
        padding: 0;
      }

      @keyframes slideIn {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
    </style>

    <script src="../assets/js/data.js?v=ui2"></script>
    <script src="../assets/js/shelf-life.js?v=ui2"></script>
    <script src="../assets/js/pricing.js?v=ui2"></script>
    <script src="../assets/js/wallet.js?v=ui2"></script>

    <script>
      let currentSeller = null;

      // Initialize
      document.addEventListener("DOMContentLoaded", () => {
        // Check if user is logged in
        const currentUser = DataManager.getCurrentUser();
        if (!currentUser || currentUser.userType !== "seller") {
          window.location.href = "../index.html";
          return;
        }

        currentSeller = DataManager.getSeller(currentUser.userId);
        if (!currentSeller) {
          window.location.href = "../index.html";
          return;
        }

        loadDashboard();
      });

      function loadDashboard() {
        // Load seller name
        document.getElementById("seller-name").textContent =
          `Selamat datang, ${currentSeller.name}`;

        // Load statistics
        const sellerListings = DataManager.getListingsBySeller(
          currentSeller.id,
        );
        const activeListings = sellerListings.filter(
          (l) => l.status === "available",
        );
        const reservedListings = sellerListings.filter(
          (l) => l.status === "reserved",
        );

        const totalWeight = activeListings.reduce(
          (sum, l) => sum + l.weight,
          0,
        );
        const walletSummary = WalletManager.getSellerWalletSummary(
          currentSeller.id,
        );

        document.getElementById("stat-listings").textContent =
          activeListings.length;
        document.getElementById("stat-weight").textContent = totalWeight;
        document.getElementById("stat-reserved").textContent =
          reservedListings.length;
        document.getElementById("stat-earnings").textContent =
          walletSummary.formattedEarnings;

        // Load recent listings
        loadListings(sellerListings.slice(0, 6));
      }

      function loadListings(listings) {
        const container = document.getElementById("listings-container");

        if (listings.length === 0) {
          container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">📭</div>
            <p>Belum ada limbah yang ditambahkan</p>
            <button class="btn btn-primary mt-lg" onclick="window.location.href='create-listing.html'">
              Tambah Limbah Pertama
            </button>
          </div>
        `;
          return;
        }

        container.innerHTML = listings
          .map((listing) => {
            const expiryInfo = ShelfLifeManager.getExpiryInfo(
              listing.category,
              listing.createdAt,
            );
            const categoryName =
              DataManager.WASTE_CATEGORIES[listing.category]?.name ||
              listing.category;

            return `
          <div class="listing-card">
              <div class="listing-image waste-visual" aria-label="Ilustrasi limbah makanan">L</div>
            <div class="listing-content">
              <div class="status-badge status-${listing.status}">
                ${listing.status === "available" ? "Tersedia" : listing.status === "reserved" ? "Dipesan" : "Kadaluarsa"}
              </div>
              <div class="listing-name">${listing.wasteName}</div>
              <div class="listing-meta">
                <div>${categoryName}</div>
                <div>${listing.weight} kg • ${listing.pricePerKg ? "Rp " + listing.pricePerKg.toLocaleString("id-ID") : "Tanyakan"}/kg</div>
              </div>
              <div class="listing-price">Rp ${(listing.finalPrice || listing.totalPrice || 0).toLocaleString("id-ID")}</div>
              <div class="listing-meta" style="font-size: var(--font-size-xs);">
                ${
                  expiryInfo.status === "expired"
                    ? `<span style="color: var(--color-error);">Kadaluarsa</span>`
                    : `<span style="color: var(--color-success);">${ShelfLifeManager.formatTimeRemaining(expiryInfo.remainingHours)}</span>`
                }
              </div>
              <div class="listing-footer">
                <button class="btn btn-outline btn-sm" onclick="viewListing('${listing.id}')">Lihat</button>
                <button class="btn btn-ghost btn-sm" onclick="editListing('${listing.id}')">Edit</button>
              </div>
            </div>
          </div>
        `;
          })
          .join("");
      }

      function viewListing(listingId) {
        window.location.href = `listing-detail.html?id=${listingId}`;
      }

      function editListing(listingId) {
        window.location.href = `create-listing.html?id=${listingId}`;
      }

      function handleLogout() {
        DataManager.logout();
        window.location.href = "../index.html";
      }
    </script>
  </body>
</html>

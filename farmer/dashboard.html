<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Peternak - LINAKAN</title>
    <link rel="stylesheet" href="../assets/css/variables.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/base.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/components.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/layout.css?v=ui2" />
    <link rel="stylesheet" href="../assets/css/responsive.css?v=ui2" />
    <style>
      .dashboard-container {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: var(--space-2xl);
        min-width: 0;
      }

      .dashboard-container > * {
        min-width: 0;
      }

      .stats-sidebar {
        display: flex;
        flex-direction: column;
        gap: var(--space-lg);
      }

      .stat-item {
        background: var(--color-white);
        border: 1px solid var(--color-border-soft);
        border-radius: var(--radius-md);
        padding: var(--space-lg);
        text-align: left;
      }

      .stat-value {
        font-size: var(--font-size-2xl);
        font-weight: var(--font-weight-bold);
        color: var(--color-primary);
        margin-bottom: var(--space-sm);
      }

      .stat-label {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-2xl);
        gap: var(--space-lg);
      }

      .section-title {
        font-size: var(--font-size-2xl);
        font-weight: var(--font-weight-bold);
        color: var(--color-text-dark);
        margin: 0;
      }

      .filter-tabs {
        display: flex;
        gap: var(--space-md);
        margin-bottom: var(--space-2xl);
        border-bottom: 1px solid var(--color-border-soft);
      }

      .filter-tab {
        padding: var(--space-md) var(--space-lg);
        background: none;
        border: none;
        font-size: var(--font-size-base);
        color: var(--color-text-muted);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all var(--transition-fast);
      }

      .filter-tab:hover {
        color: var(--color-text-dark);
      }

      .filter-tab.active {
        color: var(--color-primary);
        border-bottom-color: var(--color-primary);
      }

      .match-card {
        background: var(--color-white);
        border: 1px solid var(--color-border-soft);
        border-radius: var(--radius-md);
        overflow: hidden;
        transition: all var(--transition-base);
        margin-bottom: var(--space-2xl);
        min-width: 0;
      }

      .match-card:hover {
        box-shadow: var(--shadow-lg);
        transform: translateY(-2px);
      }

      .match-card-header {
        padding: var(--space-lg);
        background: var(--color-surface-soft);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .instant-match-badge {
        display: inline-block;
        background: var(--color-tertiary);
        color: var(--color-white);
        padding: var(--space-sm) var(--space-lg);
        border-radius: var(--radius-xl);
        font-size: var(--font-size-xs);
        font-weight: var(--font-weight-semibold);
      }

      .compatibility-score {
        display: flex;
        align-items: center;
        gap: var(--space-md);
        font-weight: var(--font-weight-semibold);
        color: var(--color-primary);
      }

      .compatibility-circle {
        width: 60px;
        height: 60px;
        border-radius: var(--radius-md);
        background: var(--color-primary);
        color: var(--color-white);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-bold);
      }

      .match-card-body {
        padding: var(--space-lg);
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: var(--space-2xl);
        min-width: 0;
      }

      .match-card-image {
        width: 100%;
        height: 150px;
        background: var(--color-light-gray);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
      }

      .match-card-info {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-width: 0;
      }

      .waste-details {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-lg);
        margin-bottom: var(--space-lg);
      }

      .detail-item {
        display: flex;
        flex-direction: column;
      }

      .detail-label {
        font-size: var(--font-size-xs);
        color: var(--color-text-muted);
        margin-bottom: var(--space-sm);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .detail-value {
        font-weight: var(--font-weight-semibold);
        color: var(--color-text-dark);
        font-size: var(--font-size-base);
      }

      .match-card-footer {
        padding: var(--space-lg);
        border-top: 1px solid var(--color-border-soft);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-lg);
      }

      .match-reason {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
        flex: 1;
      }

      .match-reason strong {
        color: var(--color-primary);
      }

      .empty-state {
        text-align: center;
        padding: var(--space-3xl);
        color: var(--color-text-muted);
        background: var(--color-white);
        border-radius: var(--radius-md);
        border: 1px dashed var(--color-border-soft);
      }

      .empty-icon {
        font-size: 48px;
        margin-bottom: var(--space-lg);
      }

      @media (max-width: 1024px) {
        .dashboard-container {
          grid-template-columns: 1fr;
        }

        .stats-sidebar {
          grid-template-columns: repeat(3, 1fr);
          flex-direction: row;
        }

        .match-card-body {
          grid-template-columns: 150px 1fr;
        }
      }

      @media (max-width: 640px) {
        .dashboard-container,
        .stats-sidebar {
          width: 100%;
          max-width: 100%;
          min-width: 0;
        }

        .stats-sidebar {
          display: grid;
          grid-template-columns: 1fr;
        }

        .match-card-body {
          grid-template-columns: minmax(0, 1fr);
        }

        .match-card-header {
          flex-direction: column;
          gap: var(--space-md);
        }

        .waste-details {
          grid-template-columns: 1fr;
        }

        .filter-tabs {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          max-width: 100%;
        }

        .filter-tab {
          white-space: nowrap;
        }

        .match-card-footer {
          flex-direction: column;
          align-items: stretch;
        }

        .match-card-footer .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <div
        class="navbar-brand"
        onclick="window.location.href = '../index.html'"
      >
        <span class="brand-mark"></span> LINAKAN
      </div>
      <ul class="navbar-menu">
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
        <li><a href="marketplace.html">Marketplace</a></li>
        <li><a href="transactions.html">Transaksi</a></li>
        <li><a href="wallet.html">Dompet</a></li>
      </ul>
      <div class="navbar-actions">
        <button class="btn btn-ghost" onclick="handleLogout()">Logout</button>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-3xl mb-3xl">
      <!-- Welcome -->
      <div style="margin-bottom: var(--space-2xl)">
        <div class="eyebrow">Rekomendasi pakan lokal</div>
        <h1>Dashboard Peternak</h1>
        <p class="page-kicker" id="farmer-name">Memuat data...</p>
      </div>

      <div class="dashboard-container">
        <!-- Main Content -->
        <div>
          <!-- Instant Match Section -->
          <div>
            <div class="section-header">
              <h2 class="section-title">Instant Match Untuk Anda</h2>
              <button class="btn btn-sm btn-outline" onclick="refreshMatches()">
                Refresh
              </button>
            </div>

            <div id="instant-matches-container">
              <!-- Instant matches will be loaded here -->
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
              <button class="filter-tab active" onclick="filterMatches('all')">
                Semua
              </button>
              <button class="filter-tab" onclick="filterMatches('instant')">
                Instant Match
              </button>
              <button class="filter-tab" onclick="filterMatches('high')">
                Kompatibel Tinggi (70%+)
              </button>
            </div>

            <div id="matches-container">
              <!-- Matches will be loaded here -->
            </div>
          </div>
        </div>

        <!-- Sidebar Stats -->
        <div class="stats-sidebar">
          <div class="stat-item">
            <div class="stat-value" id="stat-matches">0</div>
            <div class="stat-label">Total Match</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="stat-instant">0</div>
            <div class="stat-label">Instant Match</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="stat-capacity">0%</div>
            <div class="stat-label">Kapasitas Terpakai</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="stat-balance">Rp 0</div>
            <div class="stat-label">Saldo Dompet</div>
          </div>
          <div class="stat-item">
            <button
              class="btn btn-primary"
              style="width: 100%"
              onclick="window.location.href = 'wallet.html'"
            >
              Top Up Dompet
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../assets/js/data.js?v=ui2"></script>
    <script src="../assets/js/shelf-life.js?v=ui2"></script>
    <script src="../assets/js/pricing.js?v=ui2"></script>
    <script src="../assets/js/matching.js?v=ui2"></script>
    <script src="../assets/js/wallet.js?v=ui2"></script>

    <script>
      let currentFarmer = null;
      let allMatches = [];
      let currentFilter = "all";

      document.addEventListener("DOMContentLoaded", () => {
        const currentUser = DataManager.getCurrentUser();
        if (!currentUser || currentUser.userType !== "farmer") {
          window.location.href = "../index.html";
          return;
        }

        currentFarmer = DataManager.getFarmer(currentUser.userId);
        if (!currentFarmer) {
          window.location.href = "../index.html";
          return;
        }

        loadDashboard();
      });

      function loadDashboard() {
        document.getElementById("farmer-name").textContent =
          `Selamat datang, ${currentFarmer.name}`;

        // Get matches
        allMatches = MatchingEngine.findMatchesForFarmer(currentFarmer);
        const stats = MatchingEngine.getMatchingStats(allMatches);

        // Update stats
        document.getElementById("stat-matches").textContent = stats.total;
        document.getElementById("stat-instant").textContent =
          stats.instantMatches;

        // Capacity calculation (simple: weight / capacity)
        const transactions = DataManager.getTransactionsByUser(
          currentFarmer.id,
        );
        const totalWeightUsed = transactions.reduce(
          (sum, t) => sum + (t.listingWeight || 0),
          0,
        );
        const capacityUsed = Math.min(
          100,
          Math.round((totalWeightUsed / currentFarmer.capacity) * 100),
        );
        document.getElementById("stat-capacity").textContent =
          capacityUsed + "%";

        // Wallet balance
        const wallet = WalletManager.getBalance(currentFarmer.id);
        document.getElementById("stat-balance").textContent =
          wallet.formattedBalance;

        // Load instant matches first
        loadInstantMatches();

        // Then load all matches
        renderMatches("all");
      }

      function loadInstantMatches() {
        const instant = allMatches.filter((m) => m.isInstantMatch).slice(0, 3);

        if (instant.length === 0) {
          document.getElementById("instant-matches-container").innerHTML = `
          <div class="alert alert-info" style="margin-bottom: var(--space-2xl);">
            Belum ada limbah yang sempurna cocok untuk Anda saat ini. Jangan khawatir, kami terus mencari!
          </div>
        `;
          return;
        }

        const html = instant
          .map((match) => createMatchCardHTML(match, true))
          .join("");
        document.getElementById("instant-matches-container").innerHTML = html;
      }

      function renderMatches(filter) {
        currentFilter = filter;

        let filtered = allMatches;
        if (filter === "instant") {
          filtered = allMatches.filter((m) => m.isInstantMatch);
        } else if (filter === "high") {
          filtered = allMatches.filter(
            (m) => m.score >= 70 && !m.isInstantMatch,
          );
        }

        if (filtered.length === 0) {
          document.getElementById("matches-container").innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <p>Tidak ada limbah yang cocok dengan kriteria Anda saat ini</p>
          </div>
        `;
          return;
        }

        const html = filtered
          .map((match) => createMatchCardHTML(match, false))
          .join("");
        document.getElementById("matches-container").innerHTML = html;
      }

      function createMatchCardHTML(match, isInstant) {
        const { listing, score, details } = match;
        const categoryName =
          DataManager.WASTE_CATEGORIES[listing.category]?.name ||
          listing.category;

        return `
        <div class="match-card">
          <div class="match-card-header">
            <div>
              ${isInstant ? '<span class="instant-match-badge">INSTANT MATCH</span>' : ""}
            </div>
            <div class="compatibility-score">
              <div class="compatibility-circle">${score}%</div>
            </div>
          </div>

          <div class="match-card-body">
            <div class="match-card-image waste-visual" aria-label="Ilustrasi limbah makanan">L</div>
            <div class="match-card-info">
              <div>
                <h3 style="margin: 0 0 var(--space-lg) 0; color: var(--color-text-dark);">${listing.wasteName}</h3>
                <div class="waste-details">
                  <div class="detail-item">
                    <span class="detail-label">Kategori</span>
                    <span class="detail-value">${categoryName}</span>
                  </div>
                  <div class="detail-item">
                    <span class="detail-label">Berat</span>
                    <span class="detail-value">${listing.weight} kg</span>
                  </div>
                  <div class="detail-item">
                    <span class="detail-label">Harga</span>
                    <span class="detail-value">Rp ${(listing.finalPrice || listing.totalPrice).toLocaleString("id-ID")}</span>
                  </div>
                  <div class="detail-item">
                    <span class="detail-label">Jarak</span>
                    <span class="detail-value">${details.distance} km</span>
                  </div>
                </div>
              </div>
              <div class="match-reason">
                <strong>${score}% cocok</strong> berdasarkan kategori, jarak, dan kapasitas.
              </div>
            </div>
          </div>

          <div class="match-card-footer">
            <span class="match-reason">
              Dari: <strong>${listing.sellerName}</strong>
            </span>
            <button class="btn btn-primary btn-sm" onclick="viewListing('${listing.id}')">
              Lihat Detail
            </button>
          </div>
        </div>
      `;
      }

      function filterMatches(filter) {
        // Update active tab
        document
          .querySelectorAll(".filter-tab")
          .forEach((tab) => tab.classList.remove("active"));
        event.target.classList.add("active");

        renderMatches(filter);
      }

      function viewListing(listingId) {
        window.location.href = `listing-detail.html?id=${listingId}`;
      }

      function refreshMatches() {
        allMatches = MatchingEngine.findMatchesForFarmer(currentFarmer);
        loadDashboard();
      }

      function handleLogout() {
        DataManager.logout();
        window.location.href = "../index.html";
      }
    </script>
  </body>
</html>
